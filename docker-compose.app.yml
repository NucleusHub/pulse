services:
  pulse-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "pulse"
      nucleus.depends: "mongo"
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      PORT: 3004
    volumes:
      - ./server:/app
      - ../../core:/app/core:ro
      - pulse_server_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pulse_server_modules:
